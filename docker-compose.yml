services:
  api:
    build: ./api
    container_name: aurora-api
    ports:
      - "8001:8001"
    volumes:
      - ./api:/app          # o container usa a pasta api do seu PC (alteracoes aparecem na hora)
    environment:
      - PYTHONUNBUFFERED=1

  site:
    image: nginx:alpine
    container_name: aurora-site
    ports:
      - "5500:80"
    volumes:
      - ./:/usr/share/nginx/html:ro   # serve o index.html, css, js e imagens
    depends_on:
      - api
